apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Reads a value from the shared repo-root .env (the single source of truth for
// Ditto credentials across both apps; values are unquoted). Fails the build with
// a clear message when the file or key is missing or blank.
def dittoEnv(String key) {
    def envFile = rootProject.file("../.env")
    if (!envFile.isFile()) {
        throw new GradleException(
            "Shared .env not found at ${envFile.absolutePath}. Copy .env.template to .env at the repo root before building."
        )
    }
    def props = new Properties()
    envFile.withInputStream { props.load(it) }
    def value = props.getProperty(key)?.trim()
    if (!value) {
        throw new GradleException(
            "Missing or blank \"$key\" in ${envFile.absolutePath}. Fill in every value from .env.template before building."
        )
    }
    return value
}

android {

    compileSdk 35

    defaultConfig {
        applicationId "live.ditto.inventory"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 60
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }
    namespace 'live.ditto.inventory'
}

// Bake the Ditto credentials into BuildConfig from the shared repo-root .env
// (see dittoEnv), wired through androidComponents with a lazy provider so the
// file is read only when BuildConfig is actually generated — a fresh clone can
// still run non-build tasks (./gradlew tasks, IDE sync) with no .env present.
// The provider also makes the value a task input, so editing .env regenerates
// BuildConfig without a clean build. Values in .env are unquoted, so wrap each
// in quotes for the generated Java string literal.
androidComponents {
    onVariants(selector().all()) { variant ->
        ['DITTO_DATABASE_ID', 'DITTO_DEVELOPMENT_TOKEN', 'DITTO_SERVER_URL'].each { key ->
            variant.buildConfigFields.put(
                key,
                providers.provider {
                    new com.android.build.api.variant.BuildConfigField(
                        'String', "\"${dittoEnv(key)}\"".toString(), null
                    )
                }
            )
        }
    }
}

dependencies {
    implementation("com.ditto:ditto-kotlin:5.0.3")

    // Ditto Tools
    implementation "com.ditto:ditto-tools-android:6.0.0"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // Dispatchers.Main (used in the store observer) is provided by coroutines-android;
    // declare it directly rather than relying on a transitive path via fragment-ktx.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Import the Compose BOM
    implementation(platform("androidx.compose:compose-bom:2025.01.00"))

    // Compose
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.ui:ui-tooling-preview")
    debugImplementation("androidx.compose.ui:ui-tooling")
    debugImplementation("androidx.compose.ui:ui-test-manifest")
    implementation("androidx.activity:activity-compose")

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

}
